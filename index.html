<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Initiative</title>
<style>
:root { --bg:#1c2030; --surface:#262b40; --surface-active:#2f3652; --line:#3a4160; --text:#e6e8f0; --muted:#8d94ad; --accent:#7cc4e8; }
* { box-sizing: border-box; }
body { --shift:4px; margin:0; padding:12px; color:var(--text); font:14px/1.4 system-ui, sans-serif; }
body.side-right { --shift:-4px; }
body.mode-panel { background:var(--bg); }
body.mode-bar { background:transparent; padding:0; height:100vh; overflow:hidden; }
header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
h1 { margin:0; font:600 18px/1.2 Georgia, serif; }
button, input { font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
button { cursor:pointer; }
button:hover { border-color:var(--accent); }
button.primary { background:var(--accent); border-color:var(--accent); color:#10202a; font-weight:600; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.buttons { display:flex; gap:6px; }

/* portraits (used in the panel list and on the bar cards) */
.portrait { display:block; width:36px; height:36px; padding:0; border:0; border-radius:6px; overflow:hidden; background:#10131f; }
.portrait:disabled { cursor:default; }
.portrait img { display:block; width:100%; height:100%; object-fit:cover; }
.letter { display:block; font:700 18px/36px Georgia, serif; color:var(--muted); text-align:center; }

/* panel */
#bar { display:none; }
body.mode-bar #panel { display:none; }
ol { list-style:none; margin:0 0 10px; padding:0; display:grid; gap:4px; }
li { display:grid; grid-template-columns:36px 36px 1fr 56px 28px; align-items:center; gap:8px; padding:6px 8px; background:var(--surface); border-left:4px solid transparent; border-radius:6px; }
li.active { border-left-color:var(--accent); background:var(--surface-active); }
li.empty { display:block; padding:16px; color:var(--muted); text-align:center; }
.total { font:700 22px/1 Georgia, serif; font-variant-numeric:tabular-nums; text-align:center; }
.name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.roll { display:block; color:var(--muted); font-size:12px; }
input.mod { width:56px; padding:4px 6px; }
.x { padding:0 6px; border:0; background:none; color:var(--muted); font-size:18px; }
form { display:flex; gap:6px; margin-bottom:8px; }
form input[type="text"] { flex:1; min-width:0; }
form input[type="number"] { width:56px; }
label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }

/* settings */
details { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
summary { padding:4px 0; color:var(--text); font-size:13px; cursor:pointer; }
.setrow { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 0; font-size:13px; }
label.setrow { justify-content:flex-start; color:var(--text); font-size:13px; }
.seg { display:inline-flex; }
.seg button { padding:4px 12px; border-radius:0; }
.seg button:first-child { border-radius:6px 0 0 6px; }
.seg button:last-child { border-radius:0 6px 6px 0; border-left:0; }
.seg button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#10202a; font-weight:600; }

/* tracker bar (vertical) */
body.mode-bar #bar { display:flex; flex-direction:column; gap:5px; height:100%; padding:5px 6px; background:rgba(28,32,48,.94); border-radius:10px; }
#barHead { display:flex; align-items:center; justify-content:space-between; gap:4px; }
#barHead .x { padding:0 2px; font-size:14px; }
.pill { font:600 11px Georgia, serif; white-space:nowrap; }
#cards { display:flex; flex-direction:column; align-items:center; flex:1; gap:5px; min-height:0; padding:6px 8px; overflow-y:auto; scrollbar-width:thin; }
.card { position:relative; flex:none; width:67px; overflow:hidden; background:var(--surface); border:2px solid transparent; border-radius:6px; text-align:center; }
.card .portrait { width:100%; height:63px; border-radius:0; }
.card .letter { font-size:27px; line-height:63px; }
.card .total { position:absolute; top:3px; left:3px; min-width:21px; padding:0 5px; background:rgba(16,19,31,.88); border-radius:8px; font:700 11px/1.5 Georgia, serif; }
.cname { padding:2px 3px; font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#barNext { padding:3px 6px; font-size:11px; }

/* animations */
@keyframes enter { from { opacity:0; transform:translateY(-8px) scale(.96); } to { opacity:1; transform:none; } }
@keyframes glow { 0%, 100% { box-shadow:0 0 0 2px rgba(124,196,232,.25); } 50% { box-shadow:0 0 9px 3px rgba(124,196,232,.65); } }
.enter .card { animation:enter .35s ease both; animation-delay:calc(var(--i) * 45ms); }
.card.active { border-color:var(--accent); left:var(--shift); animation:glow 1.8s ease-in-out infinite; }
.enter .card.active { animation:enter .35s ease both, glow 1.8s ease-in-out infinite; animation-delay:calc(var(--i) * 45ms), calc(var(--i) * 45ms + .35s); }
@media (prefers-reduced-motion: reduce) {
  .card, .enter .card, .card.active, .enter .card.active { animation:none; }
}
body.player .gm-only { display:none; }
</style>
</head>
<body>
<main id="panel">
  <header>
    <h1 id="round">Not started</h1>
    <div class="buttons gm-only">
      <button id="start">Start</button>
      <button id="next" class="primary">Next turn</button>
      <button id="end">End combat</button>
    </div>
  </header>
  <ol id="list"></ol>
  <form id="add" class="gm-only">
    <input id="name" type="text" placeholder="Name" required />
    <input id="mod" type="number" value="0" title="Initiative modifier" />
    <button>Add</button>
  </form>
  <label class="gm-only"><input type="checkbox" id="reroll" /> Re-roll everyone at the start of each round</label>

  <details id="settings">
    <summary>⚙ Settings</summary>
    <div class="setrow">
      <span>Tracker bar side</span>
      <div class="seg" role="group" aria-label="Tracker bar side">
        <button type="button" data-side="left">Left</button>
        <button type="button" data-side="right">Right</button>
      </div>
    </div>
    <label class="setrow"><input type="checkbox" id="mapHL" /> Highlight the active token on the map</label>
    <div class="setrow"><button id="showBar" type="button">Show tracker bar</button></div>
  </details>
</main>

<div id="bar">
  <div id="barHead">
    <span id="barRound" class="pill"></span>
    <button id="hideBar" class="x" aria-label="Hide tracker bar">×</button>
  </div>
  <div id="cards"></div>
  <button id="barNext" class="primary gm-only">Next</button>
</div>

<script type="module">
import OBR, { buildShape } from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";

const ID = "com.example.random-initiative";
const KEY = `${ID}/state`;
const BAR_ID = `${ID}/bar`;
const SETTINGS_KEY = `${ID}/settings`;
const SETTINGS_MSG = `${ID}/settings-changed`;
const BAR_TOP = 70;         // distance from the top of the screen (px)
const BAR_EDGE_LEFT = 8;    // distance from the left edge (px)
const BAR_EDGE_RIGHT = 84;  // distance from the right edge; leaves room for Owlbear's tool column
const BAR_WIDTH = 100;      // width of the bar (px)
// round 0 = combat not started. turn = index into combatants.
const DEFAULT = { combatants: [], round: 0, turn: 0, rerollEachRound: true };
const DEFAULT_SETTINGS = { side: "left", mapHighlight: true };

const read = (m) => ({ ...DEFAULT, ...(m[KEY] ?? {}) });
const loadState = async () => read(await OBR.scene.getMetadata());
const saveState = (s) => OBR.scene.setMetadata({ [KEY]: s });

// personal settings, kept in this browser (so each player can choose their own)
function loadSettings() {
  try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) ?? "{}") }; }
  catch { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch { /* storage unavailable */ }
}

// ---- dice & ordering ----
const d20 = () => 1 + Math.floor(Math.random() * 20);
const rollOne = (c) => ({ ...c, roll: d20(), tiebreak: Math.random() });
// highest total first; ties -> higher modifier -> random
const sortOrder = (list) => [...list].sort((a, b) => (b.roll + b.mod) - (a.roll + a.mod) || b.mod - a.mod || b.tiebreak - a.tiebreak);
const rollAll = (list) => sortOrder(list.map(rollOne));

function withOrder(state, combatants) {
  const activeId = state.combatants[state.turn]?.id;
  const sorted = sortOrder(combatants);
  const i = sorted.findIndex((c) => c.id === activeId);
  return { ...state, combatants: sorted, turn: i < 0 ? 0 : i };
}
function addCombatant(state, { name, mod = 0, tokenId = null, img = null }) {
  if (tokenId && state.combatants.some((c) => c.tokenId === tokenId)) {
    // already in the list: just refresh its name and picture
    return { ...state, combatants: state.combatants.map((c) => (c.tokenId === tokenId ? { ...c, name, img: img ?? c.img } : c)) };
  }
  return withOrder(state, [...state.combatants, rollOne({ id: crypto.randomUUID(), name, mod, tokenId, img })]);
}
const setMod = (state, id, mod) => withOrder(state, state.combatants.map((c) => (c.id === id ? { ...c, mod } : c)));
function removeCombatant(state, id) {
  const idx = state.combatants.findIndex((c) => c.id === id);
  if (idx < 0) return state;
  const combatants = state.combatants.filter((c) => c.id !== id);
  let turn = state.turn;
  if (idx < turn) turn--;
  if (turn >= combatants.length) turn = 0;
  return { ...state, combatants, turn };
}
const startCombat = (state) => ({ ...state, round: 1, turn: 0, combatants: rollAll(state.combatants) });
function nextTurn(state) {
  if (!state.combatants.length) return state;
  if (state.round === 0) return startCombat(state);
  const turn = state.turn + 1;
  if (turn < state.combatants.length) return { ...state, turn };
  // everyone has gone: new round, fresh initiative
  return { ...state, round: state.round + 1, turn: 0, combatants: state.rerollEachRound ? rollAll(state.combatants) : state.combatants };
}
const endCombat = (state) => ({ ...DEFAULT, rerollEachRound: state.rerollEachRound });

// ---- zoom the screen to a token ----
async function focusToken(tokenId) {
  if (!tokenId) return;
  try {
    const b = await OBR.scene.items.getItemBounds([tokenId]);
    const size = Math.max(b.width, b.height, 1) * 6;
    const half = size / 2;
    await OBR.viewport.animateToBounds({
      min: { x: b.center.x - half, y: b.center.y - half },
      max: { x: b.center.x + half, y: b.center.y + half },
      width: size, height: size, center: b.center,
    });
    await OBR.player.select([tokenId]);
  } catch (err) {
    console.warn("Could not focus token", err); // e.g. the token was deleted
  }
}

// ---- the bar at the side of the screen ----
async function openBar() {
  const { side } = loadSettings();
  const right = side === "right";
  const [vw, vh] = await Promise.all([OBR.viewport.getWidth(), OBR.viewport.getHeight()]);
  await OBR.popover.open({
    id: BAR_ID,
    url: "/index.html?bar=1",
    width: BAR_WIDTH,
    height: Math.max(160, Math.min(vh - BAR_TOP - 20, 400)),
    anchorReference: "POSITION",
    anchorPosition: { left: right ? vw - BAR_EDGE_RIGHT : BAR_EDGE_LEFT, top: BAR_TOP },
    transformOrigin: { horizontal: right ? "RIGHT" : "LEFT", vertical: "TOP" },
    hidePaper: true,
    disableClickAway: true,
    marginThreshold: 0,
  });
}

// ---- background page: right-click menu, bar open/close, glowing ring on the map ----
function startBackground() {
  OBR.onReady(async () => {
    const isGM = (await OBR.player.getRole()) === "GM";

    OBR.contextMenu.create({
      id: `${ID}/add`,
      icons: [{ icon: "/add.svg", label: "Add to Initiative", filter: { every: [{ key: "layer", value: "CHARACTER" }], roles: ["GM"] } }],
      async onClick(context) {
        let state = await loadState();
        for (const item of context.items) {
          state = addCombatant(state, { name: item.name || "Token", tokenId: item.id, img: item.image?.url ?? null });
        }
        await saveState(state);
      },
    });

    // --- ring around the token whose turn it is (drawn locally, so everyone sees their own copy) ---
    let lastState = DEFAULT;
    let seq = 0;
    let ringId = null, ringToken = null, ringCenter = null, baseD = 0, k = 0, timer = null, busy = false;

    const wantedToken = () => {
      const c = lastState.round > 0 ? lastState.combatants[lastState.turn] : null;
      return loadSettings().mapHighlight && c?.tokenId ? c.tokenId : null;
    };
    // bounds of a token, or null when this viewer can't see it (deleted / hidden from players)
    async function measure(tokenId) {
      const items = await OBR.scene.items.getItems([tokenId]);
      if (!items.length || (!items[0].visible && !isGM)) return null;
      return OBR.scene.items.getItemBounds([tokenId]);
    }
    async function clearRing() {
      clearInterval(timer);
      timer = null;
      const id = ringId;
      ringId = null;
      ringToken = null;
      if (id) { try { await OBR.scene.local.deleteItems([id]); } catch { /* scene not ready */ } }
    }
    // pulse: the ring breathes in size, width and brightness
    function tick() {
      if (!ringId || busy) return;
      busy = true;
      const wave = (Math.sin((Date.now() / 1000) * 2 * Math.PI / 1.4) + 1) / 2;
      const d = baseD * (1 + 0.1 * wave);
      OBR.scene.local.updateItems([ringId], (items) => {
        for (const it of items) {
          it.width = d;
          it.height = d;
          it.position = { x: ringCenter.x - k * d, y: ringCenter.y - k * d };
          it.style.strokeWidth = 5 + 3 * wave;
          it.style.strokeOpacity = 1 - 0.45 * wave;
        }
      }).catch(() => {}).finally(() => { busy = false; });
    }
    async function highlight() {
      const want = wantedToken();
      if (want === ringToken) return;
      const mine = ++seq;
      await clearRing();
      if (!want) return;
      let b;
      try { b = await measure(want); } catch { return; }
      if (!b || mine !== seq) return;
      baseD = Math.max(b.width, b.height) * 1.15 + 10;
      ringCenter = b.center;
      const ring = buildShape()
        .shapeType("CIRCLE")
        .width(baseD).height(baseD)
        .position(b.center)
        .fillOpacity(0)
        .strokeColor("#7cc4e8").strokeWidth(5)
        .layer("ATTACHMENT").locked(true).disableHit(true)
        .build();
      await OBR.scene.local.addItems([ring]);
      if (mine !== seq) { OBR.scene.local.deleteItems([ring.id]).catch(() => {}); return; }
      ringId = ring.id;
      ringToken = want;
      // is a circle's position its centre (k = 0) or its top-left corner (k = 0.5)? measure it once.
      k = 0;
      try {
        const lb = await OBR.scene.local.getItemBounds([ring.id]);
        k = Math.max(0, Math.min(0.5, Math.round(((lb.center.x - b.center.x) / baseD) * 2) / 2));
      } catch { /* keep 0 */ }
      timer = setInterval(tick, 50);
    }
    // keep the ring on the token when it moves, resizes, is deleted, or is hidden/unhidden
    OBR.scene.items.onChange(async () => {
      if (!wantedToken()) return;
      if (!ringToken) { highlight(); return; }
      try {
        const b = await measure(ringToken);
        if (!b) { await clearRing(); return; }
        ringCenter = b.center;
        baseD = Math.max(b.width, b.height) * 1.15 + 10;
      } catch { /* ignore */ }
    });

    // --- bar open/close + reacting to state ---
    let barShown = false;
    const sync = (s) => {
      lastState = s;
      const active = s.round > 0;
      if (active && !barShown) { barShown = true; openBar(); }
      if (!active && barShown) { barShown = false; OBR.popover.close(BAR_ID); }
      highlight();
    };
    const check = async () => {
      if (await OBR.scene.isReady()) sync(await loadState());
      else sync(DEFAULT);
    };
    OBR.scene.onReadyChange(check);
    OBR.scene.onMetadataChange((m) => sync(read(m)));
    OBR.broadcast.onMessage(SETTINGS_MSG, () => highlight());
    check();
  });
}

// ---- the panel and the side bar share the same code ----
function startUI(mode) {
  let settings = loadSettings();
  document.body.classList.add(`mode-${mode}`, `side-${settings.side}`);
  let state = DEFAULT;
  let isGM = false;
  let visible = null; // players only: ids of tokens they can actually see
  let lastRound = -1;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

  // players don't get to see who is hiding behind a hidden token
  const hiddenFor = (c) => visible && c.tokenId && !visible.has(c.tokenId);
  const nameOf = (c) => (hiddenFor(c) ? "Unknown" : esc(c.name));

  function portrait(c) {
    const hide = hiddenFor(c);
    const inner = !hide && c.img
      ? `<img src="${esc(c.img)}" alt="" />`
      : `<span class="letter">${hide ? "?" : esc(Array.from((c.name || "?").trim())[0] ?? "?")}</span>`;
    const canFocus = c.tokenId && !hide;
    return `<button class="portrait" ${canFocus ? `data-focus="${esc(c.tokenId)}"` : "disabled"} aria-label="Go to ${nameOf(c)}">${inner}</button>`;
  }

  async function refreshVisible() {
    if (isGM) { visible = null; return; }
    const ids = state.combatants.map((c) => c.tokenId).filter(Boolean);
    const items = ids.length ? await OBR.scene.items.getItems(ids) : [];
    visible = new Set(items.filter((i) => i.visible).map((i) => i.id));
  }

  async function fitBar() {
    const vh = await OBR.viewport.getHeight();
    OBR.popover.setHeight(BAR_ID, Math.max(160, Math.min(vh - BAR_TOP - 20, state.combatants.length * 94 + 88)));
  }

  function renderSettings() {
    document.querySelectorAll("[data-side]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.side === settings.side)));
    $("mapHL").checked = settings.mapHighlight;
  }

  function render() {
    document.body.classList.toggle("player", !isGM);
    const label = state.round ? `Round ${state.round}` : "Not started";

    if (mode === "bar") {
      // cards flow in one by one when the bar opens or a new round re-rolls everyone
      const reshuffle = state.round !== lastRound;
      lastRound = state.round;
      $("barRound").textContent = label;
      $("cards").className = reshuffle ? "enter" : "";
      $("cards").innerHTML = state.combatants.map((c, i) => `
        <div class="card ${i === state.turn ? "active" : ""}" style="--i:${i}">
          ${portrait(c)}
          <span class="total">${c.roll + c.mod}</span>
          <div class="cname">${nameOf(c)}</div>
        </div>`).join("");
      fitBar();
      return;
    }

    $("round").textContent = label;
    $("reroll").checked = state.rerollEachRound;
    $("list").innerHTML = state.combatants.length
      ? state.combatants.map((c, i) => `
        <li class="${state.round && i === state.turn ? "active" : ""}">
          ${portrait(c)}
          <span class="total">${c.roll + c.mod}</span>
          <span class="name">${nameOf(c)}<span class="roll">d20: ${c.roll}</span></span>
          <input class="mod" type="number" value="${c.mod}" data-mod="${esc(c.id)}" aria-label="Modifier for ${nameOf(c)}" ${isGM ? "" : "disabled"} />
          ${isGM ? `<button class="x" data-remove="${esc(c.id)}" aria-label="Remove ${nameOf(c)}">×</button>` : ""}
        </li>`).join("")
      : `<li class="empty">${isGM ? "Right-click a token and choose “Add to Initiative”, or add one below." : "No combatants yet."}</li>`;
  }

  async function commit(next) { state = next; render(); await saveState(next); }

  document.addEventListener("click", (e) => {
    const f = e.target.closest("[data-focus]");
    if (f) focusToken(f.dataset.focus);
  });
  $("list").addEventListener("click", (e) => { const id = e.target.dataset.remove; if (id) commit(removeCombatant(state, id)); });
  $("list").addEventListener("change", (e) => { const id = e.target.dataset.mod; if (id) commit(setMod(state, id, Number(e.target.value) || 0)); });
  $("add").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("name").value.trim();
    if (!name) return;
    commit(addCombatant(state, { name, mod: Number($("mod").value) || 0 }));
    e.target.reset();
  });
  $("start").onclick = () => commit(startCombat(state));
  $("next").onclick = () => commit(nextTurn(state));
  $("barNext").onclick = () => commit(nextTurn(state));
  $("end").onclick = () => commit(endCombat(state));
  $("reroll").onchange = (e) => commit({ ...state, rerollEachRound: e.target.checked });
  $("showBar").onclick = () => openBar();
  $("hideBar").onclick = () => OBR.popover.close(BAR_ID);

  // settings
  document.querySelectorAll("[data-side]").forEach((b) =>
    b.addEventListener("click", async () => {
      settings = { ...settings, side: b.dataset.side };
      saveSettings(settings);
      renderSettings();
      if (state.round > 0) { await OBR.popover.close(BAR_ID); await openBar(); } // move the bar now
    })
  );
  $("mapHL").onchange = (e) => {
    settings = { ...settings, mapHighlight: e.target.checked };
    saveSettings(settings);
    OBR.broadcast.sendMessage(SETTINGS_MSG, {}, { destination: "LOCAL" }).catch(() => {});
  };
  renderSettings();

  OBR.onReady(async () => {
    isGM = (await OBR.player.getRole()) === "GM";
    const apply = async (s) => { state = s; await refreshVisible(); render(); };
    const sync = async () => { if (await OBR.scene.isReady()) await apply(await loadState()); };
    OBR.scene.onReadyChange(sync);
    OBR.scene.onMetadataChange((m) => apply(read(m)));
    if (!isGM) OBR.scene.items.onChange(async () => { await refreshVisible(); render(); });
    await sync();
    render();
  });
}

const params = new URLSearchParams(location.search);
if (params.has("bg")) startBackground();
else startUI(params.has("bar") ? "bar" : "panel");
</script>
</body>
</html>
